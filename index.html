<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Index</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
</head>

<body>
<div class="container">
  <h1>Ticket Shop</h1>
  <p>
    Fila virtual activa.
  </p>

  <table id="processTable">
    <thead>
    <tr>
      <th>ID Proceso</th>
      <th>Ráfaga (BT)</th>
      <th>Prioridad</th>
      <th class="resultado-header">T. Retorno ($T_r$)</th>
      <th class="resultado-header">T. Espera ($T_w$)</th>
    </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <div class="gantt-wrapper">
    <h2>Ejecución en Tiempo Real (Diagrama de Gantt)</h2>
    <div class="gantt-container" id="ganttChart">
      <span class="gantt-time-marker" style="left: 0;">0</span>
    </div>
  </div>

  <div class="metrics-summary" id="finalMetrics" style="display: none;">
    <h3>Resultado Promedio del Lote</h3>
    <p>Tiempo de Retorno Promedio: <strong id="avgTr"></strong> unidades.</p>
    <p>Tiempo de Espera Promedio: <strong id="avgTw"></strong>unidades.</p>
  </div>
</div>
<script src="js/app.js"></script>
